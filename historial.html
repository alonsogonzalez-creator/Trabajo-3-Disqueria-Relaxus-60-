<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial y reportes | Relaxus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/estilos.css" rel="stylesheet"></head>
<body><div id="app-navbar"></div><div class="container-fluid"><div class="row">
<div class="col-12 col-md-3 col-lg-2 p-0" id="app-sidebar"></div>
<main class="col-12 col-md-9 col-lg-10 content-area p-4 p-xl-5 page-wrap"><div class="container-fluid px-0">
<div id="historyAlert"></div>
<div class="eyebrow mb-2">Consulta de operaciones</div><h1 class="page-title h2 mb-1">Historial / Reportes</h1><p class="text-secondary mb-4">Filtra las ventas por fecha y revisa el resumen del período.</p>
<div class="card mb-4"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-12 col-md-4"><label for="dateFrom" class="form-label">Desde</label><input type="date" id="dateFrom" class="form-control"></div><div class="col-12 col-md-4"><label for="dateTo" class="form-label">Hasta</label><input type="date" id="dateTo" class="form-control"></div><div class="col-12 col-md-4"><button id="filterSales" class="btn btn-relaxus w-100">Aplicar filtro</button></div></div></div></div>
<div class="row g-3 mb-4"><div class="col-12 col-md-6"><div class="card"><div class="card-body"><div class="text-secondary small">Ventas en el período</div><div class="fs-3 fw-bold" id="periodCount">0</div></div></div></div><div class="col-12 col-md-6"><div class="card"><div class="card-body"><div class="text-secondary small">Total vendido</div><div class="fs-3 fw-bold" id="periodTotal">$0</div></div></div></div></div>
<div class="card"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th class="ps-4">Fecha y hora</th><th>N.º de venta</th><th>Artículos</th><th>Total</th></tr></thead><tbody id="salesTable"></tbody></table></div><div id="emptySales" class="empty-state d-none">No hay ventas registradas para el período seleccionado.</div></div></div></div>
<div id="app-footer"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script><script>if(requireAuth()){renderShell("historial.html");}</script><script>let sales=[];function renderSales(){const from=document.querySelector("#dateFrom").value,to=document.querySelector("#dateTo").value;let filtered=sales.filter(s=>{const d=s.fecha.slice(0,10);return(!from||d>=from)&&(!to||d<=to);});if(from&&to&&from>to){document.querySelector("#historyAlert").innerHTML=alertBox("La fecha inicial no puede ser posterior a la fecha final.","warning");return;}document.querySelector("#historyAlert").innerHTML="";document.querySelector("#periodCount").textContent=filtered.length;document.querySelector("#periodTotal").textContent=money(filtered.reduce((a,s)=>a+s.total,0));document.querySelector("#salesTable").innerHTML=filtered.sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(s=>`<tr><td class="ps-4">${new Date(s.fecha).toLocaleString("es-CL")}</td><td>#${s.id_venta.toString().slice(-6)}</td><td>${s.items.reduce((a,x)=>a+x.cantidad,0)} artículo(s)</td><td class="fw-semibold">${money(s.total)}</td></tr>`).join("");document.querySelector("#emptySales").classList.toggle("d-none",filtered.length>0);}sales=getSales();renderSales();document.querySelector("#filterSales").addEventListener("click",renderSales);</script></body></html>
