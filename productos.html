<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos e inventario | Relaxus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/estilos.css" rel="stylesheet"></head>
<body><div id="app-navbar"></div><div class="container-fluid"><div class="row">
<div class="col-12 col-md-3 col-lg-2 p-0" id="app-sidebar"></div>
<main class="col-12 col-md-9 col-lg-10 content-area p-4 p-xl-5 page-wrap"><div class="container-fluid px-0">
<div id="productAlert"></div>
<div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4"><div><div class="eyebrow mb-2">Catálogo interno</div><h1 class="page-title h2 mb-1">Productos / Inventario</h1><p class="text-secondary mb-0">Busca artículos, aplica filtros y revisa las existencias.</p></div><a href="producto-form.html" class="btn btn-relaxus"><i class="bi bi-plus-lg me-1"></i>Nuevo producto</a></div>
<div class="card mb-3"><div class="card-body"><div class="row g-3"><div class="col-12 col-lg-6"><label for="searchProduct" class="form-label">Buscar por código o nombre</label><input id="searchProduct" class="form-control" placeholder="Ej. VIN-0001 o Abbey Road"></div><div class="col-12 col-lg-3"><label for="filterFormat" class="form-label">Filtrar por formato</label><select id="filterFormat" class="form-select"><option value="">Todos los formatos</option><option>Vinilo</option><option>CD</option><option>Casete</option><option>Accesorio</option><option>Otro</option></select></div><div class="col-12 col-lg-3 d-flex align-items-end"><button id="clearFilters" class="btn btn-outline-secondary w-100">Limpiar filtros</button></div></div></div></div>
<div class="card"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th class="ps-4">Código</th><th>Nombre</th><th>Formato</th><th>Precio</th><th>Stock</th><th class="text-end pe-4">Acciones</th></tr></thead><tbody id="productsTable"></tbody></table></div><div id="emptyProducts" class="empty-state d-none">No se encontraron productos que coincidan con la búsqueda.</div></div></div>
<div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="detailTitle">Detalle del producto</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body" id="detailContent"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button></div></div></div></div></div>
<div id="app-footer"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script><script>if(requireAuth()){renderShell("productos.html");}</script><script>let allProducts=[];function drawProducts(){const q=document.querySelector("#searchProduct").value.trim().toLowerCase(),f=document.querySelector("#filterFormat").value;const rows=allProducts.filter(p=>(!f||p.formato===f)&&(!q||p.codigo.toLowerCase().includes(q)||p.nombre.toLowerCase().includes(q)));document.querySelector("#productsTable").innerHTML=rows.map(p=>`<tr><td class="ps-4 fw-semibold">${p.codigo}</td><td>${p.nombre}</td><td>${p.formato}</td><td>${money(p.precio_venta)}</td><td>${stockBadge(p.stock_actual)}</td><td class="text-end pe-4 text-nowrap"><button class="btn btn-sm btn-outline-secondary" onclick="showDetail(${p.id_producto})" aria-label="Ver ${p.nombre}"><i class="bi bi-eye"></i></button> <a class="btn btn-sm btn-outline-primary" href="producto-form.html?id=${p.id_producto}" aria-label="Editar ${p.nombre}"><i class="bi bi-pencil"></i></a></td></tr>`).join("");document.querySelector("#emptyProducts").classList.toggle("d-none",rows.length>0);}function showDetail(id){const p=allProducts.find(x=>x.id_producto===id);document.querySelector("#detailContent").innerHTML=`<dl class="row mb-0"><dt class="col-5">Código</dt><dd class="col-7">${p.codigo}</dd><dt class="col-5">Nombre</dt><dd class="col-7">${p.nombre}</dd><dt class="col-5">Formato</dt><dd class="col-7">${p.formato}</dd><dt class="col-5">Precio</dt><dd class="col-7">${money(p.precio_venta)}</dd><dt class="col-5">Stock actual</dt><dd class="col-7">${stockBadge(p.stock_actual)}</dd></dl>`;bootstrap.Modal.getOrCreateInstance(document.querySelector("#detailModal")).show();}(async()=>{try{allProducts=await loadProducts();drawProducts();}catch(e){document.querySelector("#productAlert").innerHTML=alertBox(e.message,"danger");}})();document.querySelector("#searchProduct").addEventListener("input",drawProducts);document.querySelector("#filterFormat").addEventListener("change",drawProducts);document.querySelector("#clearFilters").addEventListener("click",()=>{document.querySelector("#searchProduct").value="";document.querySelector("#filterFormat").value="";drawProducts();});</script></body></html>
