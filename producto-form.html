<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario de producto | Relaxus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/estilos.css" rel="stylesheet"></head>
<body><div id="app-navbar"></div><div class="container-fluid"><div class="row">
<div class="col-12 col-md-3 col-lg-2 p-0" id="app-sidebar"></div>
<main class="col-12 col-md-9 col-lg-10 content-area p-4 p-xl-5 page-wrap"><div class="container-fluid px-0">
<div id="formAlert"></div>
<div class="eyebrow mb-2">Administración de catálogo</div><h1 class="page-title h2 mb-1" id="formTitle">Crear producto</h1><p class="text-secondary mb-4">Completa los datos del artículo musical. Los campos marcados son obligatorios.</p>
<div class="card"><div class="card-body p-4"><form id="productForm" novalidate><div class="row g-3">
<div class="col-12 col-md-6"><label for="codigo" class="form-label">Código</label><input id="codigo" class="form-control" maxlength="30" required><div class="invalid-feedback">Ingresa un código.</div></div>
<div class="col-12 col-md-6"><label for="nombre" class="form-label">Nombre del álbum, artista o artículo</label><input id="nombre" class="form-control" maxlength="120" required><div class="invalid-feedback">Ingresa un nombre (máximo 120 caracteres).</div></div>
<div class="col-12 col-md-4"><label for="formato" class="form-label">Formato</label><select id="formato" class="form-select" required><option value="">Selecciona un formato</option><option>Vinilo</option><option>CD</option><option>Casete</option><option>Accesorio</option><option>Otro</option></select><div class="invalid-feedback">Selecciona un formato.</div></div>
<div class="col-12 col-md-4"><label for="precio" class="form-label">Precio de venta (CLP)</label><input id="precio" type="number" min="1" step="1" class="form-control" required><div class="invalid-feedback">Ingresa un precio mayor que cero.</div></div>
<div class="col-12 col-md-4"><label for="stock" class="form-label">Stock actual</label><input id="stock" type="number" min="0" step="1" class="form-control" required><div class="invalid-feedback">Ingresa un stock igual o mayor que cero.</div></div>
</div><div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-relaxus" type="submit"><i class="bi bi-check2 me-1"></i>Guardar producto</button><a href="productos.html" class="btn btn-outline-secondary">Cancelar</a></div></form></div></div></div>
<div id="app-footer"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script><script>if(requireAuth()){renderShell("producto-form.html");}</script><script>const params=new URLSearchParams(location.search),editId=Number(params.get("id"));let productList=[];(async()=>{productList=await loadProducts();if(editId){const p=productList.find(x=>x.id_producto===editId);if(!p){document.querySelector("#formAlert").innerHTML=alertBox("No se encontró el producto solicitado.","warning");return;}document.querySelector("#formTitle").textContent="Editar producto";document.querySelector("#codigo").value=p.codigo;document.querySelector("#nombre").value=p.nombre;document.querySelector("#formato").value=p.formato;document.querySelector("#precio").value=p.precio_venta;document.querySelector("#stock").value=p.stock_actual;}})().catch(e=>document.querySelector("#formAlert").innerHTML=alertBox(e.message,"danger"));document.querySelector("#productForm").addEventListener("submit",e=>{e.preventDefault();const f=e.currentTarget;f.classList.add("was-validated");const precio=Number(document.querySelector("#precio").value),stock=Number(document.querySelector("#stock").value);if(!f.checkValidity()||precio<=0||stock<0||!Number.isInteger(stock))return;const codigo=document.querySelector("#codigo").value.trim(),nombre=document.querySelector("#nombre").value.trim();if(productList.some(p=>p.codigo.toLowerCase()===codigo.toLowerCase()&&p.id_producto!==editId)){document.querySelector("#formAlert").innerHTML=alertBox("Ya existe un producto con ese código. Utiliza uno diferente.","danger");return;}const item={id_producto:editId||Math.max(0,...productList.map(p=>p.id_producto))+1,codigo,nombre,formato:document.querySelector("#formato").value,precio_venta:precio,stock_actual:stock};if(editId)productList=productList.map(p=>p.id_producto===editId?item:p);else productList.push(item);saveProducts(productList);document.querySelector("#formAlert").innerHTML=alertBox("Producto guardado correctamente. Volviendo al inventario...","success");setTimeout(()=>location.href="productos.html",900);});</script></body></html>
