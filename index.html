<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso | Relaxus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/estilos.css" rel="stylesheet"></head>
<body><main class="login-shell"><section class="card login-card shadow-lg"><div class="card-body p-4 p-md-5"><div class="text-center mb-4"><div class="login-brand">RELAXUS<span class="brand-dot">.</span></div><p class="text-secondary mb-0">Sistema de gestión interna</p></div><h1 class="h4 fw-bold mb-1">Iniciar sesión</h1><p class="text-secondary small mb-4">Ingresa tus credenciales para acceder al panel.</p><div id="loginMessage"></div>
<form id="loginForm" novalidate><div class="mb-3"><label for="usuario" class="form-label">Usuario</label><input class="form-control" id="usuario" name="usuario" autocomplete="username" required><div class="invalid-feedback">Ingresa tu usuario.</div></div>
<div class="mb-4"><label for="contrasena" class="form-label">Contraseña</label><input type="password" class="form-control" id="contrasena" name="contrasena" autocomplete="current-password" required minlength="4"><div class="invalid-feedback">Ingresa una contraseña de al menos 4 caracteres.</div></div>
<button class="btn btn-relaxus w-100 py-2" type="submit">Acceder <i class="bi bi-arrow-right ms-1"></i></button></form>
<div class="alert alert-light border small mt-4 mb-0"><strong>Acceso de demostración</strong><br>Usuario: <code>admin</code> · Contraseña: <code>relaxus123</code></div>
</div></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>document.querySelector("#loginForm").addEventListener("submit",e=>{e.preventDefault();const f=e.currentTarget;f.classList.add("was-validated");if(!f.checkValidity())return;const u=document.querySelector("#usuario").value.trim();const p=document.querySelector("#contrasena").value;if(u==="admin"&&p==="relaxus123"){sessionStorage.setItem("relaxus_user",u);location.href="panel.html";}else{document.querySelector("#loginMessage").innerHTML='<div class="alert alert-danger" role="alert">Usuario o contraseña incorrectos. Revisa tus datos e inténtalo nuevamente.</div>';}});</script></body></html>
